<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Near-realtime Whisper</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #2b3445;
    --muted: #8b95a7;
    --tint: #eef2fb;
    --tint-hover: #e2e9f9;
    --accent: #4285f4;
    --danger: #d9534f;
    --line: rgba(0, 0, 0, .08);
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101319;
      --fg: #e6eaf2;
      --muted: #7d8798;
      --tint: #1b2130;
      --tint-hover: #232b3d;
      --line: rgba(255, 255, 255, .1);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }

  /* ---------- idle splash ---------- */

  #splash {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.25rem;
  }
  body:not([data-state="idle"]) #splash { display: none; }

  .bubble {
    position: relative;
    background: var(--tint);
    color: var(--accent);
    font-size: 1.35rem;
    font-weight: 500;
    padding: .75rem 1.5rem;
    border-radius: 999px;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -9px;
    width: 20px; height: 12px;
    transform: translateX(-50%);
    background: var(--tint);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }

  .mic-hero {
    width: 132px; height: 132px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow);
    transition: transform .15s ease, filter .15s ease;
  }
  .mic-hero:hover { transform: scale(1.03); }
  .mic-hero:active { transform: scale(.97); }
  .mic-hero svg { width: 58px; height: 58px; }

  .hint { color: var(--muted); font-size: .85rem; }

  /* ---------- transcript ---------- */

  #stage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
    padding: 2.5rem clamp(1rem, 5vw, 3.5rem) 1.5rem;
  }
  #stage::-webkit-scrollbar { width: 10px; }
  #stage::-webkit-scrollbar-thumb {
    background: var(--line);
    border: 3px solid transparent;
    background-clip: content-box;
    border-radius: 999px;
  }
  #stage::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: content-box; }
  body[data-state="idle"] #stage { display: none; }

  #transcript {
    /* `margin-top: auto` bottom-anchors short transcripts. Using
       justify-content: flex-end instead would make overflow unreachable. */
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: .3rem;
    font-size: clamp(.95rem, 1.25vw, 1.1rem);
    line-height: 1.5;
    letter-spacing: -.005em;
  }
  .line {
    position: relative;
    padding-left: 1rem;
    animation: rise .25s ease both;
  }
  .line::before {
    content: "";
    position: absolute;
    left: 0; top: .25em; bottom: .25em;
    width: 3px;
    border-radius: 2px;
    background: var(--c);
  }
  .line .pending { color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  #listening {
    color: var(--muted);
    font-size: .85rem;
    padding-left: 1rem;
  }
  #listening[hidden] { display: none; }
  #listening i { font-style: normal; animation: blink 1.4s infinite; }
  #listening i:nth-child(2) { animation-delay: .2s; }
  #listening i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ---------- control bar ---------- */

  #bar {
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 1rem;
    padding: .9rem clamp(.75rem, 3vw, 1.75rem) 1.25rem;
    border-top: 1px solid var(--line);
    background: var(--bg);
  }
  body[data-state="idle"] #bar { border-top: 0; }
  body[data-state="idle"] #controls,
  body[data-state="idle"] #brand { visibility: hidden; }

  #brand { display: flex; align-items: center; gap: .55rem; font-weight: 600; font-size: .95rem; }
  #brand .dot {
    width: 26px; height: 26px; border-radius: 50%;
    background: conic-gradient(#4285f4 0 33%, #f4b400 0 66%, #34a853 0);
    box-shadow: inset 0 0 0 3px var(--bg);
  }
  #status { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }

  #controls { display: flex; align-items: center; gap: .9rem; }
  #tools { display: flex; align-items: center; justify-content: flex-end; gap: .6rem; }

  .pill {
    display: inline-flex; align-items: center; gap: .45rem;
    height: 44px; padding: 0 1.1rem;
    border-radius: 999px;
    background: var(--tint);
    color: var(--fg);
    font-size: .9rem;
    transition: background .15s ease;
  }
  .pill:hover:not(:disabled) { background: var(--tint-hover); }
  .pill[aria-pressed="true"] { background: var(--accent); color: #fff; }

  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--tint);
    color: var(--accent);
    display: grid; place-items: center;
    transition: background .15s ease, transform .1s ease;
  }
  .icon-btn:hover:not(:disabled) { background: var(--tint-hover); }
  .icon-btn:active:not(:disabled) { transform: scale(.94); }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }

  /* Floats over the transcript so it stays reachable while scrolled back. */
  #autoscroll {
    position: fixed;
    top: 1rem;
    right: clamp(1rem, 5vw, 3.5rem);
    z-index: 5;
    background: var(--bg);
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  #autoscroll:hover { background: var(--tint); }
  #autoscroll[aria-pressed="true"] {
    background: var(--accent);
    border-color: transparent;
    color: #fff;
  }
  body[data-state="idle"] #autoscroll { display: none; }

  /* Live input-level meter: --level is 0..1, updated each animation frame. */
  #level {
    --level: 0;
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }
  #level::before {
    /* Soft halo that breathes with the signal. */
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--accent);
    opacity: calc(.12 + var(--level) * .28);
    transform: scale(calc(.55 + var(--level) * .45));
    z-index: -2;
  }
  #level::after {
    /* Level fills the disc from the bottom. */
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: calc(var(--level) * 100%);
    background: var(--accent);
    opacity: .35;
    z-index: -1;
  }
  #level svg { transform: scale(calc(1 + var(--level) * .12)); }
  /* Muted: the meter decays to zero on its own, so only the tint changes. */
  #level[data-muted="true"] { color: var(--muted); }

  .primary {
    width: 68px; height: 68px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    display: grid; place-items: center;
    box-shadow: var(--shadow);
    transition: transform .12s ease;
  }
  .primary:hover { transform: scale(1.04); }
  .primary:active { transform: scale(.96); }
  .primary svg { width: 26px; height: 26px; }

  body[data-state="ended"] #pause,
  body[data-state="ended"] #level { display: none; }

  @media (max-width: 640px) {
    #brand span:not(.dot) { display: none; }
    /* No room for the language pill on a phone; the setting persists either way. */
    #detect { display: none; }
    #bar { grid-template-columns: auto auto auto; }
  }
</style>
</head>
<body data-state="idle">

<main id="splash">
  <div class="bubble">Press and start talking</div>
  <button class="mic-hero" id="hero" aria-label="Start transcribing">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor" stroke="none"/>
      <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/>
    </svg>
  </button>
  <p class="hint">Solid text is committed &middot; grey text is the live hypothesis</p>
</main>

<button class="icon-btn" id="autoscroll" title="Auto-scroll is on" aria-pressed="true" aria-label="Toggle auto-scroll">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6.5 12 12l6-5.5M6 13.5 12 19l6-5.5"/>
  </svg>
</button>

<section id="stage">
  <div id="transcript"></div>
  <div id="listening" hidden>listening<i>.</i><i>.</i><i>.</i></div>
</section>

<footer id="bar">
  <div id="brand">
    <span class="dot"></span>
    <span>Whisper live</span>
    <span id="status"></span>
  </div>

  <div id="controls">
    <button class="icon-btn" id="pause" title="Pause capture" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
    <button class="primary" id="primary" aria-label="Stop">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
    </button>
    <button class="icon-btn" id="level" title="Input level — click to mute" data-muted="false" aria-label="Microphone level">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor" stroke="none"/>
        <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
      </svg>
    </button>
  </div>

  <div id="tools">
    <button class="icon-btn" id="clear" title="Clear saved transcript" aria-label="Clear transcript">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h16M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12"/>
      </svg>
    </button>
    <button class="icon-btn" id="copy" title="Copy transcript" aria-label="Copy transcript">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
        <rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A1.5 1.5 0 0 0 13.5 4H6a2 2 0 0 0-2 2v7.5A1.5 1.5 0 0 0 5.5 15"/>
      </svg>
    </button>
    <button class="icon-btn" id="expand" title="Fullscreen" aria-label="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/>
      </svg>
    </button>
    <button class="pill" id="detect" aria-pressed="false" title="Let the model detect the language">
      <span id="detectLabel">Detect Language</span>
    </button>
  </div>
</footer>

<script>
const TARGET_RATE = 16000;
const COLORS = ['#4285f4', '#f4a340', '#34a853', '#a855f7'];

const body = document.body;
const hero = document.getElementById('hero');
const primary = document.getElementById('primary');
const pauseBtn = document.getElementById('pause');
const levelBtn = document.getElementById('level');
const autoScrollBtn = document.getElementById('autoscroll');
const clearBtn = document.getElementById('clear');
const copyBtn = document.getElementById('copy');
const expandBtn = document.getElementById('expand');
const detectBtn = document.getElementById('detect');
const detectLabel = document.getElementById('detectLabel');
const statusEl = document.getElementById('status');
const stage = document.getElementById('stage');
const transcript = document.getElementById('transcript');
const listening = document.getElementById('listening');

let ws = null, ctx = null, node = null, stream = null, analyser = null;
let firstTextAt = null, startedAt = null;
let line = null, colorIndex = 0;
let paused = false, muted = false, autoDetect = false;

const micIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
  <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor" stroke="none"/>
  <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>`;
const stopIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>`;
const pauseIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>`;
const playIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.6c0-.9 1-1.5 1.8-1L18.3 11c.7.5.7 1.5 0 2l-8.5 5.4c-.8.5-1.8-.1-1.8-1V5.6Z"/></svg>`;

function setStatus(text) { statusEl.textContent = text; }
function setState(state) { body.dataset.state = state; }

function newLine(color = colorIndex++) {
  const el = document.createElement('div');
  el.className = 'line';
  el.dataset.color = String(color % COLORS.length);
  el.style.setProperty('--c', COLORS[color % COLORS.length]);
  el.innerHTML = '<span class="committed"></span><span class="pending"></span>';
  transcript.appendChild(el);
  return el;
}

// Auto-scroll follows the tail until the reader scrolls away from the bottom,
// and re-engages by itself once they scroll back down to it.
const STICK_PX = 48;
let autoScroll = true;

function atBottom() {
  return stage.scrollHeight - stage.scrollTop - stage.clientHeight <= STICK_PX;
}

function setAutoScroll(on) {
  if (autoScroll === on) return;
  autoScroll = on;
  autoScrollBtn.setAttribute('aria-pressed', String(on));
  autoScrollBtn.title = on ? 'Auto-scroll is on' : 'Auto-scroll is off — click to follow';
}

function scrollToBottom(force) {
  if (!autoScroll && !force) return;
  stage.scrollTop = stage.scrollHeight;
}

stage.addEventListener('scroll', () => setAutoScroll(atBottom()), { passive: true });

autoScrollBtn.onclick = () => {
  setAutoScroll(!autoScroll);
  if (autoScroll) scrollToBottom(true);
};

function render(msg) {
  const hasText = Boolean(msg.commit || msg.pending);
  if (hasText && !line) line = newLine();

  if (line) {
    const committed = line.querySelector('.committed');
    const pending = line.querySelector('.pending');

    if (msg.commit) {
      // Append-only delta.
      committed.textContent += (committed.textContent ? ' ' : '') + msg.commit.text;
    }
    // Replace semantics.
    pending.textContent = msg.pending ? (committed.textContent ? ' ' : '') + msg.pending : '';

    if (msg.endOfSegment && committed.textContent.trim()) {
      pending.textContent = '';
      line = null;
    }
  }

  if (hasText) listening.hidden = true;
  if (firstTextAt === null && hasText) {
    firstTextAt = performance.now();
    setStatus(`first text in ${Math.round(firstTextAt - startedAt)} ms`);
  }
  if (autoDetect && msg.language) detectLabel.textContent = msg.language.toUpperCase();
  scrollToBottom();
}

// Exponentially smoothed RMS meter. Rises quickly, falls slowly, so the disc
// tracks speech without flickering on every frame.
let meterRaf = null, meterValue = 0, meterBuf = null;

function meterTick() {
  let target = 0;
  if (analyser && !muted && !paused) {
    analyser.getFloatTimeDomainData(meterBuf);
    let sum = 0;
    for (let i = 0; i < meterBuf.length; i++) sum += meterBuf[i] * meterBuf[i];
    const rms = Math.sqrt(sum / meterBuf.length);
    // Perceptual-ish curve: quiet speech should still move the needle.
    target = Math.min(1, Math.sqrt(rms) * 2.6);
  }
  const smoothing = target > meterValue ? 0.35 : 0.08;
  meterValue += (target - meterValue) * smoothing;
  levelBtn.style.setProperty('--level', meterValue.toFixed(3));
  meterRaf = requestAnimationFrame(meterTick);
}

function startMeter() { if (meterRaf === null) meterTick(); }

function stopMeter() {
  if (meterRaf !== null) { cancelAnimationFrame(meterRaf); meterRaf = null; }
  meterValue = 0;
  levelBtn.style.setProperty('--level', '0');
}

function fullText() {
  return [...transcript.querySelectorAll('.line')]
    .map(el => el.textContent.trim())
    .filter(Boolean)
    .join('\n');
}

/* ---------- persistence ---------- */

// Only committed text is stored; the pending hypothesis is still in flux and
// would be misleading to restore.
const STORE_KEY = 'whisper-live.transcript';
const SAVE_EVERY_MS = 30_000;
let lastSaved = '';

function snapshot() {
  return [...transcript.querySelectorAll('.line')]
    .map(el => ({ text: el.querySelector('.committed').textContent.trim(), color: Number(el.dataset.color) || 0 }))
    .filter(l => l.text);
}

function save() {
  const lines = snapshot();
  const json = JSON.stringify({ v: 1, savedAt: new Date().toISOString(), lines });
  if (json === lastSaved) return false;
  try {
    if (lines.length) localStorage.setItem(STORE_KEY, json);
    else localStorage.removeItem(STORE_KEY);
    lastSaved = json;
    return true;
  } catch (e) {
    console.warn('transcript not saved', e);
    return false;
  }
}

function restore() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); }
  catch { return; }
  if (!saved || !Array.isArray(saved.lines) || !saved.lines.length) return;

  for (const l of saved.lines) {
    newLine(l.color).querySelector('.committed').textContent = l.text;
  }
  // Continue the colour cycle where the restored transcript left off.
  colorIndex = (saved.lines[saved.lines.length - 1].color + 1) % COLORS.length;
  line = null;

  setState('ended');
  primary.innerHTML = micIcon;
  primary.setAttribute('aria-label', 'Start again');
  setStatus(`restored from ${new Date(saved.savedAt).toLocaleTimeString()}`);
  scrollToBottom(true);
}

function flashSaved() {
  const previous = statusEl.textContent;
  setStatus(`saved ${new Date().toLocaleTimeString()}`);
  setTimeout(() => {
    if (statusEl.textContent.startsWith('saved')) {
      setStatus(body.dataset.state === 'live' ? (paused ? 'paused' : 'listening…') : previous);
    }
  }, 2500);
}

setInterval(() => { if (save()) flashSaved(); }, SAVE_EVERY_MS);
addEventListener('pagehide', save);

async function start() {
  startedAt = performance.now();
  firstTextAt = null;
  paused = muted = false;
  pauseBtn.innerHTML = pauseIcon;
  pauseBtn.title = 'Pause capture';
  pauseBtn.setAttribute('aria-label', 'Pause');
  levelBtn.dataset.muted = 'false';
  // A new session continues the transcript; earlier lines are never discarded.
  line = null;
  listening.hidden = false;
  setState('live');
  setStatus('connecting…');
  setAutoScroll(true);
  scrollToBottom(true);
  primary.innerHTML = stopIcon;
  primary.setAttribute('aria-label', 'Stop');

  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: true }
  });

  // Ask for 16 kHz directly; the browser resamples the mic better than we can.
  // The worklet falls back to its own downsampler if the request isn't honoured.
  try { ctx = new AudioContext({ sampleRate: TARGET_RATE }); }
  catch { ctx = new AudioContext(); }
  await ctx.resume();
  await ctx.audioWorklet.addModule('audio-worklet.js');

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    ws.send(JSON.stringify({
      type: 'start',
      sampleRate: TARGET_RATE,
      encoding: 'pcm_s16le',
      language: autoDetect ? null : 'en'
    }));
  };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    switch (msg.type) {
      case 'ready':
        setStatus('listening…');
        break;
      case 'transcript':
        render(msg);
        break;
      case 'done':
        setStatus('done');
        break;
      case 'error':
        setStatus(`error: ${msg.code}`);
        console.error(msg);
        break;
    }
  };

  ws.onclose = () => stop(true);
  ws.onerror = () => setStatus('connection error');

  const source = ctx.createMediaStreamSource(stream);

  analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  meterBuf = new Float32Array(analyser.fftSize);
  source.connect(analyser);
  startMeter();

  node = new AudioWorkletNode(ctx, 'capture-processor', {
    numberOfInputs: 1,
    numberOfOutputs: 0,
    processorOptions: { targetRate: TARGET_RATE, frameSamples: 2048 } // ~128 ms
  });
  node.port.onmessage = (ev) => {
    if (paused) return;
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(ev.data.buffer ?? ev.data);
  };
  source.connect(node);
}

function stop(fromClose) {
  stopMeter();
  analyser = null;
  if (node) { node.port.postMessage('stop'); node.disconnect(); node = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (ctx) { ctx.close(); ctx = null; }
  if (ws && !fromClose && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'stop' }));
  }
  if (!fromClose) setStatus('stopping…');

  listening.hidden = true;
  paused = false;
  pauseBtn.innerHTML = pauseIcon;
  save();
  setState(transcript.children.length ? 'ended' : 'idle');
  primary.innerHTML = micIcon;
  primary.setAttribute('aria-label', 'Start again');
}

async function begin() {
  hero.disabled = primary.disabled = true;
  try { await start(); }
  catch (e) {
    setStatus(`mic error: ${e.message}`);
    console.error(e);
    setState(transcript.children.length ? 'ended' : 'idle');
  }
  finally { hero.disabled = primary.disabled = false; }
}

hero.onclick = begin;

primary.onclick = () => {
  if (body.dataset.state === 'live') stop(false);
  else begin();
};

pauseBtn.onclick = () => {
  if (body.dataset.state !== 'live') return;
  paused = !paused;
  // Paused only gates the send loop — the socket, worklet and mic stay live,
  // so resuming continues the same stream with no reconnect.
  pauseBtn.innerHTML = paused ? playIcon : pauseIcon;
  pauseBtn.title = paused ? 'Resume capture' : 'Pause capture';
  pauseBtn.setAttribute('aria-label', paused ? 'Resume' : 'Pause');
  setStatus(paused ? 'paused' : 'listening…');
};

levelBtn.onclick = () => {
  if (!stream) return;
  muted = !muted;
  stream.getAudioTracks().forEach(t => { t.enabled = !muted; });
  levelBtn.dataset.muted = String(muted);
  levelBtn.title = muted ? 'Unmute microphone' : 'Input level — click to mute';
};

clearBtn.onclick = () => {
  if (!transcript.children.length) return;
  transcript.replaceChildren();
  line = null;
  colorIndex = 0;
  lastSaved = '';
  try { localStorage.removeItem(STORE_KEY); } catch {}
  if (body.dataset.state !== 'live') setState('idle');
  setStatus('cleared');
};

copyBtn.onclick = async () => {
  const text = fullText();
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    setStatus('copied');
  } catch { setStatus('copy blocked'); }
};

expandBtn.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};

detectBtn.onclick = () => {
  autoDetect = !autoDetect;
  detectBtn.setAttribute('aria-pressed', String(autoDetect));
  detectLabel.textContent = autoDetect ? 'Auto' : 'Detect Language';
  if (body.dataset.state === 'live') setStatus('applies on next start');
};

restore();

addEventListener('keydown', (e) => {
  if (e.code === 'Space' && e.target === document.body) {
    e.preventDefault();
    body.dataset.state === 'live' ? pauseBtn.click() : primary.click();
  }
});
</script>
</body>
</html>
